# snmpd da VM do lab (roda no container "snmpd" com a rede do host)
# Escuta na porta 161/UDP da VM.
agentaddress udp:161

# Comunidade SOMENTE LEITURA, aceita apenas da rede Docker do lab (onde está o Zabbix Server).
# Em produção: use SNMPv3 (usuário + autenticação + criptografia).
rocommunity lab-noc-ro 172.30.0.0/24

sysLocation    Home lab - Poa, SP
sysContact     Ariel Cipriano (NOC)
sysServices    72

# Disco: monitora a raiz da VM (montada no container em /hostfs)
disk /hostfs 10%
